name: Web to APK Builder (Capacitor)
on:
  push:
    branches: [ "main", "master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Prepare Web Files
        run: |
          mkdir www
          rsync -a --exclude='www' --exclude='.git' --exclude='.github' ./www/
      - name: Initialize Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          echo '{
          "appld": "com.renojohnson.artistic",
          "appName": "Artistic",
          "webDir": "www",
          "bundledWebRuntime": false
          }' > capacitor.config.json
          npx cap add android
          # Check for the image, rename it to icon.png, and generate assets safely
          mkdir -p assets
          if [ -f "logo.png" ]; then
          mv logo.png assets/icon.png
          npx @capacitor/assets generate --android
          else
          echo "No logo.png found. Skipping custom icons so the build does not crash."
          fi
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Artistic-App-APK
          path: android/app/build/outputs/apk/debug/*.apk
