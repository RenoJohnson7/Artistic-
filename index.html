
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistic - Creative Hub</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel (Compiles React JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script> 

    <!-- Import Map to load React, Icons, and Firebase directly in the browser -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.292.0",
          "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
        }
      }
    </script>
</head>
<body class="bg-black text-white">
    <!-- This is where the React App will render -->
    <div id="root"></div> 

    <!-- The actual App Code -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { ChevronLeft, Lightbulb, Palette, MessageSquare, Send, Plus, Share, X, Brush, Upload } from 'lucide-react'; 
        
        // Imported real authentication methods
        import { initializeApp } from 'firebase/app';
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile } from 'firebase/auth';
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, serverTimestamp, setDoc } from 'firebase/firestore'; 

        // --- Your Exact Firebase Configuration from Console ---
        const firebaseConfig = {
          apiKey: "AIzaSyA-Uw_690-VJNExmR3Uv9iQguus-K50w4",
          authDomain: "artistic-d885f.firebaseapp.com",
          databaseURL: "https://artistic-d885f-default-rtdb.firebaseio.com",
          projectId: "artistic-d885f",
          storageBucket: "artistic-d885f.firebasestorage.app",
          messagingSenderId: "682686110297",
          appId: "1:682686110297:web:80f2620faa9289b6a9ef48",
          measurementId: "G-Q5ZXN9TX78"
        }; 

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "artistic-app-prod";  

        // --- Main App Component ---
        function App() {
          const [user, setUser] = useState(null);
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [username, setUsername] = useState(''); 
          const [authLoading, setAuthLoading] = useState(true);

          useEffect(() => {
            const unsubscribe = onAuthStateChanged(auth, (firebaseUser) => {
              if (firebaseUser) {
                setUser(firebaseUser);
                setUsername(firebaseUser.displayName || firebaseUser.email.split('@')[0]);
                setIsLoggedIn(true);
              } else {
                setUser(null);
                setIsLoggedIn(false);
                setUsername('');
              }
              setAuthLoading(false);
            });
            
            return () => unsubscribe();
          }, []); 

          if (authLoading) {
            return (
              <div className="min-h-screen bg-[#1a1a1a] flex items-center justify-center font-sans">
                <div className="text-[#22c55e] animate-pulse font-bold text-xl">Loading Artistic...</div>
              </div>
            );
          } 

          return (
            <div className="min-h-screen w-full relative font-sans overflow-x-hidden text-white flex flex-col">
              <div className="fixed inset-0 z-[-2] bg-[url('https://img.magnific.com/premium-photo/green-black-poster-with-anime-character-green-hair_1172671-16750.jpg')] bg-cover bg-center bg-fixed"></div>
              <div className="fixed inset-0 z-[-1] bg-black/60"></div> 

              {!isLoggedIn ? (
                <WelcomeLoginFlow />
              ) : (
                <MainApp user={user} username={username} onLogout={() => signOut(auth)} />
              )}
            </div>
          );
        } 

        // --- Welcome & Login/Signup Flow Component ---
        function WelcomeLoginFlow() {
          const [view, setView] = useState('welcome'); 
          const [formData, setFormData] = useState({ username: '', email: '', password: '' });
          const [isSubmitting, setIsSubmitting] = useState(false);
          const [toast, setToast] = useState({ show: false, text: '', isError: false }); 

          const showMessage = (text, isError = false) => {
            setToast({ show: true, text, isError });
            setTimeout(() => setToast({ show: false, text: '', isError: false }), 5000);
          }; 

          const handleSubmit = async (e) => {
            e.preventDefault();
            setIsSubmitting(true);
            
            try {
              if (view === 'signup') {
                const userCredential = await createUserWithEmailAndPassword(auth, formData.email, formData.password);
                await updateProfile(userCredential.user, { displayName: formData.username });
                await setDoc(doc(db, 'users', userCredential.user.uid), {
                  username: formData.username,
                  email: formData.email,
                  createdAt: serverTimestamp()
                });
                showMessage("Account created! Logging you in...");
              } else if (view === 'login') {
                await signInWithEmailAndPassword(auth, formData.email, formData.password);
                showMessage("Welcome back!");
              }
            } catch (error) {
              console.error("Auth Error:", error);
              showMessage(error.message || "An error occurred. Please try again.", true);
              setIsSubmitting(false);
            }
          }; 

          return (
            <div className="w-full min-h-screen flex flex-col relative animate-[fadeIn_0.5s_ease-in-out]">
              <style>{`
                @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
              `}</style> 

              <header className="fixed top-0 left-0 w-full h-20 bg-[#166534] flex items-center justify-between px-6 md:px-10 shadow-[0_4px_6px_rgba(0,0,0,0.3)] z-[100]">
                <h1 className="text-2xl md:text-[28px] font-bold text-white">Artistic</h1>
                <nav className="flex gap-4 md:gap-10">
                  <a href="#" className="text-sm md:text-[18px] text-white font-bold hover:text-[#a3ffa3] transition-colors">Homepage</a>
                  <a href="#" className="text-sm md:text-[18px] text-white font-bold hover:text-[#a3ffa3] transition-colors">Server</a>
                </nav>
              </header> 

              {view === 'welcome' ? (
                <main className="flex flex-col items-center justify-center flex-1 pt-20 text-center px-4 animate-[fadeIn_0.5s_ease-in-out]">
                  <p className="text-[8vw] md:text-[5vw] font-serif font-bold text-[#c0c0c0] mb-10 drop-shadow-[2px_2px_8px_rgba(0,0,0,0.7)] leading-[1.2] max-w-[1000px]">
                    Share your art, with millions of Artists
                  </p>
                  <div className="flex gap-4 flex-col sm:flex-row">
                    <button 
                      onClick={() => setView('login')}
                      className="bg-[#22c55e] text-white px-10 py-4 rounded-full text-xl font-bold shadow-[6px_6px_12px_rgba(0,0,0,0.4)] hover:-translate-y-1 hover:bg-[#16a34a] transition-all"
                    >
                      Log In
                    </button>
                    <button 
                      onClick={() => setView('signup')}
                      className="bg-white text-green-800 px-10 py-4 rounded-full text-xl font-bold shadow-[6px_6px_12px_rgba(0,0,0,0.4)] hover:-translate-y-1 hover:bg-gray-200 transition-all"
                    >
                      Sign Up Free
                    </button>
                  </div>
                </main>
              ) : (
                <div className="flex flex-col justify-center items-center min-h-screen pt-20 px-4 animate-[fadeIn_0.5s_ease-in-out] w-full">
                  <div className="bg-black/60 p-8 rounded-[15px] w-full max-w-[400px] shadow-[0_8px_32px_rgba(0,0,0,0.5)] border border-white/10">
                    
                    <div className="flex justify-between items-center mb-6">
                      <h1 className="text-white text-2xl font-bold drop-shadow-[0_0_10px_rgba(0,255,0,0.8)]">
                        {view === 'signup' ? 'Create Account' : 'Welcome Back'}
                      </h1>
                      <button onClick={() => setView('welcome')} className="text-gray-400 hover:text-white">
                        <X size={24} />
                      </button>
                    </div>
                    
                    <form onSubmit={handleSubmit} className="flex flex-col gap-5">
                      {view === 'signup' && (
                        <div className="flex flex-col">
                          <label className="text-white mb-2 font-bold text-sm tracking-wide">Username:</label>
                          <input 
                            type="text" 
                            required minLength={3}
                            placeholder="CreativeName123"
                            value={formData.username}
                            onChange={e => setFormData({...formData, username: e.target.value})}
                            className="p-3 rounded-lg border-none bg-white/90 text-black text-base outline-none focus:shadow-[0_0_8px_#22c55e]" 
                          />
                        </div>
                      )}
                      
                      <div className="flex flex-col">
                        <label className="text-white mb-2 font-bold text-sm tracking-wide">Email:</label>
                        <input 
                          type="email" 
                          required
                          placeholder="your@email.com"
                          value={formData.email}
                          onChange={e => setFormData({...formData, email: e.target.value})}
                          className="p-3 rounded-lg border-none bg-white/90 text-black text-base outline-none focus:shadow-[0_0_8px_#22c55e]" 
                        />
                      </div>

                      <div className="flex flex-col">
                        <label className="text-white mb-2 font-bold text-sm tracking-wide">Password:</label>
                        <input 
                          type="password" 
                          required minLength={6}
                          placeholder="At least 6 characters"
                          value={formData.password}
                          onChange={e => setFormData({...formData, password: e.target.value})}
                          className="p-3 rounded-lg border-none bg-white/90 text-black text-base outline-none focus:shadow-[0_0_8px_#22c55e]" 
                        />
                      </div>
                      
                      <div className="flex flex-col mt-2">
                        <button 
                          type="submit" 
                          disabled={isSubmitting}
                          className="bg-white text-green-700 px-10 py-3 rounded-full text-base font-bold transition-all hover:bg-[#e0e0e0] hover:scale-105 disabled:opacity-70"
                        >
                          {isSubmitting ? 'Processing...' : (view === 'signup' ? 'Sign Up' : 'Log In')}
                        </button>
                      </div>

                      <div className="text-center mt-4">
                        <button 
                          type="button" 
                          onClick={() => setView(view === 'login' ? 'signup' : 'login')} 
                          className="text-sm text-green-400 hover:text-green-300 underline"
                        >
                          {view === 'login' ? "Don't have an account? Sign up" : "Already have an account? Log in"}
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )} 

              <div className={`fixed bottom-5 left-1/2 -translate-x-1/2 px-8 py-4 rounded-lg font-bold shadow-[0_4px_12px_rgba(0,0,0,0.3)] z-[1000] transition-opacity duration-300 pointer-events-none text-center max-w-[90vw] ${toast.show ? 'opacity-100' : 'opacity-0'} ${toast.isError ? 'bg-red-600 text-white' : 'bg-[#22c55e] text-white'}`}>
                {toast.text}
              </div>
            </div>
          );
        } 

        // --- Main Fullscreen Application Layout ---
        function MainApp({ user, username, onLogout }) {
          const [currentScreen, setCurrentScreen] = useState('Home'); 

          return (
            <div className="min-h-screen w-full flex flex-col bg-black/40 backdrop-blur-[2px] animate-[fadeIn_0.5s_ease-in-out]">
              <header className="bg-[#4CAF50] text-white px-8 h-20 flex items-center justify-between shadow-lg z-20 shrink-0">
                <div className="flex items-center gap-4">
                  {currentScreen !== 'Home' && (
                    <button 
                      onClick={() => setCurrentScreen('Home')}
                      className="p-2 hover:bg-black/10 rounded-full transition-colors flex items-center gap-1 text-sm font-semibold cursor-pointer"
                    >
                      <ChevronLeft size={24} /> Dashboard
                    </button>
                  )}
                  <h1 className="text-xl md:text-2xl font-bold tracking-wide">
                    Artistic {currentScreen !== 'Home' && `— ${currentScreen}`}
                  </h1>
                </div> 

                <div className="flex items-center gap-4">
                  <div className="hidden md:block text-sm font-semibold bg-black/20 px-4 py-2 rounded-full border border-white/10">
                    👤 {username}
                  </div>
                  <button 
                    onClick={onLogout}
                    className="text-xs bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-2 rounded-lg transition-colors cursor-pointer"
                  >
                    Logout
                  </button>
                </div>
              </header> 

              <main className="flex-1 w-full max-w-7xl mx-auto p-6 md:p-10 flex flex-col">
                {currentScreen === 'Home' && <HomeScreen navigate={setCurrentScreen} />}
                {currentScreen === 'Chat' && <ChatScreen user={user} username={username} />}
                {currentScreen === 'Creations' && <CreationsScreen user={user} username={username} />}
                {currentScreen === 'Suggestions' && <SuggestionsScreen user={user} username={username} />}
              </main>
            </div>
          );
        } 

        // --- Fullscreen App Screens --- 
        function HomeScreen({ navigate }) {
          const tiles = [
            { key: 'Suggestions', color: '#8BC34A', icon: Lightbulb, desc: 'View discussions and give feedback on community artwork' },
            { key: 'Creations', color: '#4CAF50', icon: Palette, desc: 'Upload your artwork or paint digitally on the canvas' },
            { key: 'Chat', color: '#2E7D32', icon: MessageSquare, desc: 'Connect and chat in real-time with artists worldwide' },
          ]; 

          return (
            <div className="flex-1 flex flex-col items-center justify-center max-w-4xl mx-auto w-full py-10">
              <div className="text-center mb-10">
                <h2 className="text-4xl font-extrabold mb-3 drop-shadow-md">Welcome to your Creative Hub</h2>
                <p className="text-gray-200 text-lg">Select a section below to get started</p>
              </div> 

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                {tiles.map((tile) => (
                  <button
                    key={tile.key}
                    onClick={() => navigate(tile.key)}
                    className="rounded-3xl p-8 flex flex-col items-center text-center shadow-xl transition-all hover:-translate-y-2 hover:shadow-2xl text-white cursor-pointer group"
                    style={{ backgroundColor: tile.color }}
                  >
                    <div className="w-20 h-20 rounded-full bg-white/20 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                      <tile.icon size={40} />
                    </div>
                    <span className="text-2xl font-extrabold tracking-wider uppercase mb-3">
                      {tile.key}
                    </span>
                    <p className="text-sm text-white/90 leading-relaxed">
                      {tile.desc}
                    </p>
                  </button>
                ))}
              </div>
            </div>
          );
        } 

        function ChatScreen({ user, username }) {
          const [messages, setMessages] = useState([]);
          const [inputText, setInputText] = useState('');
          const endOfMessagesRef = useRef(null); 

          useEffect(() => {
            if (!user) return;
            const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
            
            const unsubscribe = onSnapshot(messagesRef, (snapshot) => {
              const msgs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              msgs.sort((a, b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));
              setMessages(msgs);
            }, (error) => console.error(error)); 

            return () => unsubscribe();
          }, [user]); 

          useEffect(() => {
            endOfMessagesRef.current?.scrollIntoView({ behavior: 'smooth' });
          }, [messages]); 

          const sendMessage = async (e) => {
            e.preventDefault();
            if (!inputText.trim()) return;
            const textToSend = inputText;
            setInputText(''); 
            
            try {
              await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
                text: textToSend,
                userId: user.uid,
                authorName: username,
                timestamp: serverTimestamp()
              });
            } catch (error) {
              console.error("Error sending message:", error);
            }
          }; 

          return (
            <div className="flex-1 flex flex-col bg-white/95 backdrop-blur rounded-2xl shadow-2xl overflow-hidden border border-white/20 text-gray-800 max-w-4xl mx-auto w-full h-[650px]">
              <div className="p-4 bg-gray-100 border-b font-bold text-gray-700 flex items-center gap-2">
                <MessageSquare size={20} className="text-[#2E7D32]" /> Global Artist Chat Room
              </div> 

              <div className="flex-1 overflow-y-auto p-6 space-y-4">
                {messages.length === 0 ? (
                  <div className="text-center text-gray-400 mt-20 text-base">No messages yet. Say hi to the community!</div>
                ) : (
                  messages.map((msg) => {
                    const isMe = msg.userId === user.uid;
                    return (
                      <div key={msg.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                        {!isMe && (
                           <span className="text-xs font-bold text-[#2E7D32] mb-1 px-1">
                             {msg.authorName || 'Unknown'}
                           </span>
                        )}
                        <div className={`max-w-[70%] rounded-2xl px-5 py-3 shadow-sm ${
                          isMe ? 'bg-[#2E7D32] text-white rounded-br-none' : 'bg-gray-100 text-gray-800 rounded-bl-none'
                        }`}>
                          <p className="text-base leading-relaxed break-words">{msg.text}</p>
                        </div>
                      </div>
                    );
                  })
                )}
                <div ref={endOfMessagesRef} />
              </div> 

              <form onSubmit={sendMessage} className="bg-gray-50 p-4 border-t flex gap-3">
                <input
                  type="text"
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  placeholder="Type a message to the community..."
                  className="flex-1 bg-white text-black rounded-xl px-5 py-3 border border-gray-200 outline-none focus:ring-2 focus:ring-[#2E7D32]/50 text-base"
                />
                <button
                  type="submit"
                  disabled={!inputText.trim()}
                  className="bg-[#2E7D32] hover:bg-[#256628] text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 disabled:opacity-50 cursor-pointer transition-colors"
                >
                  <Send size={18} /> Send
                </button>
              </form>
            </div>
          );
        } 

        function CreationsScreen({ user, username }) {
          const [creations, setCreations] = useState([]);
          const [showModal, setShowModal] = useState(false); 

          useEffect(() => {
            if (!user) return;
            const creationsRef = collection(db, 'artifacts', appId, 'public', 'data', 'creations');
            
            const unsubscribe = onSnapshot(creationsRef, (snapshot) => {
              const arts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              arts.sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
              setCreations(arts);
            }, (error) => console.error(error)); 

            return () => unsubscribe();
          }, [user]); 

          const pingToSuggestions = async (creationId) => {
            try {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'creations', creationId);
              await updateDoc(docRef, { pinged: true });
            } catch (error) {
              console.error("Error pinging:", error);
            }
          }; 

          return (
            <div className="flex-1 flex flex-col bg-white/95 backdrop-blur rounded-2xl shadow-2xl overflow-hidden border border-white/20 text-gray-800 max-w-6xl mx-auto w-full h-[650px] relative">
              <div className="p-4 bg-gray-100 border-b font-bold text-gray-700 flex justify-between items-center">
                <div className="flex items-center gap-2">
                  <Palette size={20} className="text-[#4CAF50]" /> Community Art Gallery
                </div>
                <button
                  onClick={() => setShowModal(true)}
                  className="bg-[#4CAF50] hover:bg-[#43a047] text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 cursor-pointer transition-colors shadow"
                >
                  <Plus size={16} /> Upload or Draw Art
                </button>
              </div> 

              <div className="flex-1 overflow-y-auto p-6">
                {creations.length === 0 ? (
                  <div className="text-center text-gray-400 mt-20 text-base">No artwork uploaded yet. Be the first to share your creations!</div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    {creations.map((art) => (
                      <div key={art.id} className="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100 flex flex-col group hover:shadow-xl transition-shadow">
                        <div className="relative aspect-square bg-gray-50 overflow-hidden">
                          <img src={art.imageData} alt="Artwork" className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                        </div>
                        <div className="p-3 bg-gray-50 flex items-center justify-between border-t">
                          <span className="text-xs font-semibold text-gray-600 truncate">By {art.authorName || 'Artist'}</span>
                          <button 
                            onClick={() => pingToSuggestions(art.id)}
                            disabled={art.pinged}
                            className={`px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 cursor-pointer transition-colors ${
                              art.pinged ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-[#4CAF50]/10 text-[#4CAF50] hover:bg-[#4CAF50]/20'
                            }`}
                          >
                            <Share size={12} /> {art.pinged ? 'In Suggestions' : 'Ping for Feedback'}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div> 

              {showModal && (
                <CreationUploadModal 
                  user={user} 
                  username={username}
                  onClose={() => setShowModal(false)} 
                />
              )}
            </div>
          );
        } 

        function CreationUploadModal({ user, username, onClose }) {
          const [tab, setTab] = useState('upload'); 
          const [imagePreview, setImagePreview] = useState(null);
          const canvasRef = useRef(null);
          const [isDrawingProcess, setIsDrawingProcess] = useState(false); 

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return; 

            const reader = new FileReader();
            reader.onload = (event) => {
              setImagePreview(event.target.result);
            };
            reader.readAsDataURL(file);
          }; 

          useEffect(() => {
            if (tab === 'draw') {
              const canvas = canvasRef.current;
              if (!canvas) return;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
          }, [tab]); 

          const startDrawing = (e) => {
            e.preventDefault();
            setIsDrawingProcess(true);
            draw(e);
          }; 

          const stopDrawing = () => {
            setIsDrawingProcess(false);
            const canvas = canvasRef.current;
            if (canvas) {
              canvas.getContext('2d').beginPath();
            }
          }; 

          const draw = (e) => {
            e.preventDefault();
            if (!isDrawingProcess) return; 

            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY; 

            const x = ((clientX - rect.left) / rect.width) * canvas.width;
            const y = ((clientY - rect.top) / rect.height) * canvas.height; 

            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#222222'; 

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
          }; 

          const publishArt = async () => {
            let dataUrl = imagePreview; 

            if (tab === 'draw') {
              const canvas = canvasRef.current;
              if (!canvas) return;
              dataUrl = canvas.toDataURL('image/png');
            } 

            if (!dataUrl) return; 

            try {
              await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'creations'), {
                imageData: dataUrl,
                userId: user.uid,
                authorName: username,
                timestamp: serverTimestamp(),
                pinged: false
              });
              onClose();
            } catch (error) {
              console.error("Error publishing art:", error);
            }
          }; 

          return (
            <div className="absolute inset-0 bg-black/70 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-3xl w-full max-w-lg shadow-2xl flex flex-col items-center">
                <div className="flex justify-between items-center w-full mb-4">
                  <h3 className="font-bold text-xl text-gray-800">Share Your Artwork</h3>
                  <button onClick={onClose} className="p-2 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-600 cursor-pointer transition-colors">
                    <X size={20} />
                  </button>
                </div> 

                <div className="flex bg-gray-100 p-1 rounded-xl w-full mb-4">
                  <button
                    onClick={() => setTab('upload')}
                    className={`flex-1 py-2 rounded-lg font-bold text-sm flex items-center justify-center gap-2 cursor-pointer transition-all ${
                      tab === 'upload' ? 'bg-white text-[#4CAF50] shadow-sm' : 'text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    <Upload size={16} /> Upload Image File
                  </button>
                  <button
                    onClick={() => setTab('draw')}
                    className={`flex-1 py-2 rounded-lg font-bold text-sm flex items-center justify-center gap-2 cursor-pointer transition-all ${
                      tab === 'draw' ? 'bg-white text-[#4CAF50] shadow-sm' : 'text-gray-500 hover:text-gray-700'
                    }`}
                  >
                    <Brush size={16} /> Draw on Canvas
                  </button>
                </div> 

                {tab === 'upload' ? (
                  <div className="w-full flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-2xl p-6 bg-gray-50 mb-6">
                    {imagePreview ? (
                      <div className="relative w-full aspect-square max-h-64 mb-3">
                        <img src={imagePreview} alt="Preview" className="w-full h-full object-contain rounded-xl" />
                        <button 
                          onClick={() => setImagePreview(null)}
                          className="absolute top-2 right-2 bg-red-600 text-white p-1 rounded-full text-xs"
                        >
                          <X size={14} />
                        </button>
                      </div>
                    ) : (
                      <label className="flex flex-col items-center cursor-pointer py-8">
                        <Upload size={48} className="text-gray-400 mb-2" />
                        <span className="text-sm font-semibold text-gray-600">Click to browse or drop an image file</span>
                        <span className="text-xs text-gray-400 mt-1">PNG, JPG, WEBP</span>
                        <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                      </label>
                    )}
                  </div>
                ) : (
                  <canvas
                    ref={canvasRef}
                    width={400}
                    height={350}
                    className="w-full aspect-[4/3.5] bg-white rounded-2xl shadow-inner border-2 border-gray-200 touch-none cursor-crosshair mb-6"
                    onMouseDown={startDrawing}
                    onMouseUp={stopDrawing}
                    onMouseOut={stopDrawing}
                    onMouseMove={draw}
                    onTouchStart={startDrawing}
                    onTouchEnd={stopDrawing}
                    onTouchMove={draw}
                  />
                )} 

                <button
                  onClick={publishArt}
                  disabled={tab === 'upload' && !imagePreview}
                  className="w-full bg-[#4CAF50] hover:bg-[#43a047] text-white py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 cursor-pointer transition-colors shadow-lg text-base disabled:opacity-50"
                >
                  <Plus size={20} /> Publish to Community Gallery
                </button>
              </div>
            </div>
          );
        } 

        function SuggestionsScreen({ user, username }) {
          const [pingedArt, setPingedArt] = useState([]);
          const [allSuggestions, setAllSuggestions] = useState([]);
          const [commentInputs, setCommentInputs] = useState({}); 

          useEffect(() => {
            if (!user) return;
            
            const creationsRef = collection(db, 'artifacts', appId, 'public', 'data', 'creations');
            const unsubCreations = onSnapshot(creationsRef, (snapshot) => {
              const arts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              const filtered = arts.filter(a => a.pinged).sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
              setPingedArt(filtered);
            }, (err) => console.error(err)); 

            const suggestionsRef = collection(db, 'artifacts', appId, 'public', 'data', 'suggestions');
            const unsubSuggestions = onSnapshot(suggestionsRef, (snapshot) => {
              const suggs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              suggs.sort((a, b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));
              setAllSuggestions(suggs);
            }, (err) => console.error(err)); 

            return () => { unsubCreations(); unsubSuggestions(); };
          }, [user]); 

          const sendSuggestion = async (creationId) => {
            const text = commentInputs[creationId];
            if (!text || !text.trim()) return; 

            try {
              await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'suggestions'), {
                creationId,
                text,
                userId: user.uid,
                authorName: username,
                timestamp: serverTimestamp()
              });
              setCommentInputs({ ...commentInputs, [creationId]: '' }); 
            } catch (error) {
              console.error("Error sending suggestion:", error);
            }
          }; 

          return (
            <div className="flex-1 flex flex-col bg-white/95 backdrop-blur rounded-2xl shadow-2xl overflow-hidden border border-white/20 text-gray-800 max-w-5xl mx-auto w-full h-[650px]">
              <div className="p-4 bg-gray-100 border-b font-bold text-gray-700 flex items-center gap-2">
                <Lightbulb size={20} className="text-[#8BC34A]" /> Artwork Suggestions & Discussions
              </div> 

              <div className="flex-1 overflow-y-auto p-6 space-y-6">
                {pingedArt.length === 0 ? (
                  <div className="text-center text-gray-400 mt-20 text-base">No artwork has been pinged for suggestions yet. Visit Creations and click "Ping for Feedback" on any art piece!</div>
                ) : (
                  pingedArt.map(art => {
                    const suggestions = allSuggestions.filter(s => s.creationId === art.id);
                    
                    return (
                      <div key={art.id} className="bg-white rounded-2xl shadow-md border border-gray-200 overflow-hidden flex flex-col md:flex-row">
                        <div className="bg-gray-50 p-6 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-gray-200 md:w-1/3">
                          <img src={art.imageData} alt="Artwork" className="w-48 h-48 object-cover rounded-xl shadow border border-gray-100 mb-3" />
                          <span className="text-xs font-bold text-gray-600">Artist: {art.authorName || 'Unknown'}</span>
                        </div>
                        
                        <div className="flex-1 flex flex-col justify-between p-4 md:p-6 bg-white">
                          <div className="space-y-3 mb-4">
                            <h4 className="text-xs font-extrabold text-gray-400 uppercase tracking-wider">Community Feedback & Suggestions</h4>
                            <div className="max-h-40 overflow-y-auto space-y-2 pr-2">
                              {suggestions.length === 0 ? (
                                <p className="text-sm text-gray-400 italic">No suggestions yet. Be the first to share your thoughts!</p>
                              ) : (
                                suggestions.map(s => (
                                  <div key={s.id} className="bg-gray-50 p-3 rounded-xl border border-gray-100">
                                    <div className="flex justify-between items-center mb-1">
                                      <span className="text-xs font-bold text-[#8BC34A]">{s.authorName || 'Anonymous'}</span>
                                    </div>
                                    <p className="text-sm text-gray-700">{s.text}</p>
                                  </div>
                                ))
                              )}
                            </div>
                          </div>

                          <div className="flex gap-2">
                            <input
                              type="text"
                              value={commentInputs[art.id] || ''}
                              onChange={(e) => setCommentInputs({ ...commentInputs, [art.id]: e.target.value })}
                              placeholder="Write a suggestion or feedback..."
                              className="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-[#8BC34A]/50 text-black"
                            />
                            <button
                              onClick={() => sendSuggestion(art.id)}
                              className="bg-[#8BC34A] hover:bg-[#7cb342] text-white px-4 py-2 rounded-xl font-bold text-sm cursor-pointer transition-colors"
                            >
                              Post
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          );
        }

        // Render the React App into the root DOM node
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
