<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artistic</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-black text-white min-h-screen">
    <div id="root"></div>

    <!-- Complete App Script -->
    <script type="text/babel">
import React, { useState, useEffect, useRef } from 'react';
import { initializeApp } from 'firebase/app';
import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'firebase/auth';
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, serverTimestamp } from 'firebase/firestore';

// --- Firebase Initialization ---
const firebaseConfig = {
  apiKey: "AIzaSyA-Uw_690-VJNExmR3Uv9iQguus-K50w4",
  authDomain: "artistic-d885f.firebaseapp.com",
  projectId: "artistic-d885f",
  storageBucket: "artistic-d885f.firebasestorage.app",
  messagingSenderId: "682686110297",
  appId: "1:682686110297:web:80f2620faa9289b6a9ef48",
  measurementId: "G-Q5ZXN9TX78"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const appId = "artistic-app-prod";

// --- Main App Component ---
export default function App() {
  const [user, setUser] = useState(null);
  const [isLoggedIn, setIsLoggedIn] = useState(false);
  const [username, setUsername] = useState('');

  useEffect(() => {
    const initAuth = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.error("Auth Error:", error);
      }
    };
    initAuth();
    const unsubscribe = onAuthStateChanged(auth, setUser);
    return () => unsubscribe();
  }, []);

  if (!user) {
    return (
      <div className="min-h-screen bg-[#1a1a1a] flex items-center justify-center font-sans">
        <div className="text-[#22c55e] animate-pulse font-bold text-xl">Connecting to Server...</div>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full relative font-sans overflow-x-hidden text-white flex flex-col">
      <div className="fixed inset-0 z-[-2] bg-[url('https://img.magnific.com/premium-photo/green-black-poster-with-anime-character-green-hair_1172671-16750.jpg')] bg-cover bg-center bg-fixed"></div>
      <div className="fixed inset-0 z-[-1] bg-black/60"></div>

      {!isLoggedIn ? (
        <WelcomeLoginFlow 
          user={user} 
          onLoginSuccess={(name) => {
            setUsername(name);
            setIsLoggedIn(true);
          }} 
        />
      ) : (
        <MainApp user={user} username={username} onLogout={() => setIsLoggedIn(false)} />
      )}
    </div>
  );
}

// --- Welcome & Login Flow Component ---
function WelcomeLoginFlow({ user, onLoginSuccess }) {
  const [view, setView] = useState('welcome');
  const [formData, setFormData] = useState({ username: '', password: '', email: '', dob: '' });
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [toast, setToast] = useState({ show: false, text: '', isError: false });

  const showMessage = (text, isError = false) => {
    setToast({ show: true, text, isError });
    setTimeout(() => setToast({ show: false, text: '', isError: false }), 3000);
  };

  const handleLoginSubmit = async (e) => {
    e.preventDefault();
    if (!user) {
      showMessage("Connecting to server... Please try again.", true);
      return;
    }

    setIsSubmitting(true);
    try {
      const userCollection = collection(db, 'artifacts', appId, 'users', user.uid, 'registrations');
      await addDoc(userCollection, {
        username: formData.username,
        email: formData.email,
        dateOfBirth: formData.dob,
        createdAt: new Date().toISOString()
      });

      showMessage("Success! Logging you in...");
      setTimeout(() => {
        onLoginSuccess(formData.username);
      }, 1000);

    } catch (error) {
      console.error("Error saving data:", error);
      showMessage("Failed to save data. Try again.", true);
      setIsSubmitting(false);
    }
  };

  return (
    <div className="w-full min-h-screen flex flex-col relative">
      <header className="fixed top-0 left-0 w-full h-20 bg-[#166534] flex items-center justify-between px-6 md:px-10 shadow-lg z-[100]">
        <h1 className="text-2xl md:text-[28px] font-bold text-white">Artistic</h1>
        <nav className="flex gap-4 md:gap-10">
          <a href="#" className="text-sm md:text-[18px] text-white font-bold hover:text-[#a3ffa3]">Homepage</a>
          <a href="#" className="text-sm md:text-[18px] text-white font-bold hover:text-[#a3ffa3]">Server</a>
          <a href="#" className="text-sm md:text-[18px] text-white font-bold hover:text-[#a3ffa3]">Rules</a>
        </nav>
      </header>

      {view === 'welcome' ? (
        <main className="flex flex-col items-center justify-center flex-1 pt-20 text-center px-4">
          <p className="text-[8vw] md:text-[5vw] font-serif font-bold text-[#c0c0c0] mb-10 leading-[1.2] max-w-[1000px]">
            Share your art, with millions of Artists
          </p>
          <button 
            onClick={() => setView('login')}
            className="bg-[#22c55e] text-white px-10 py-4 rounded-full text-xl font-bold shadow-xl hover:bg-[#16a34a] cursor-pointer"
          >
            Login now
          </button>
        </main>
      ) : (
        <div className="flex flex-col justify-center items-center min-h-screen pt-20 px-4 w-full">
          <h1 className="text-white text-3xl text-center mb-8">Login</h1>
          <form onSubmit={handleLoginSubmit} className="bg-black/60 p-8 rounded-[15px] w-full max-w-[400px] border border-white/10 flex flex-col gap-5">
            <div className="flex flex-col">
              <label className="text-white mb-2 font-bold text-sm">Username:</label>
              <input 
                type="text" required minLength={4}
                placeholder="Enter your username"
                value={formData.username}
                onChange={e => setFormData({...formData, username: e.target.value})}
                className="p-3 rounded-lg bg-white/90 text-black text-base outline-none" 
              />
            </div>
            <div className="flex flex-col">
              <label className="text-white mb-2 font-bold text-sm">Password:</label>
              <input 
                type="password" required minLength={6}
                placeholder="Enter secure password"
                value={formData.password}
                onChange={e => setFormData({...formData, password: e.target.value})}
                className="p-3 rounded-lg bg-white/90 text-black text-base outline-none" 
              />
            </div>
            <div className="flex flex-col">
              <label className="text-white mb-2 font-bold text-sm">Email:</label>
              <input 
                type="email" required
                placeholder="your@email.com"
                value={formData.email}
                onChange={e => setFormData({...formData, email: e.target.value})}
                className="p-3 rounded-lg bg-white/90 text-black text-base outline-none" 
              />
            </div>
            <div className="flex flex-col">
              <label className="text-white mb-2 font-bold text-sm">Date of Birth:</label>
              <input 
                type="date" required
                value={formData.dob}
                onChange={e => setFormData({...formData, dob: e.target.value})}
                className="p-3 rounded-lg bg-white/90 text-black text-base outline-none" 
              />
            </div>
            <div className="flex justify-center mt-4">
              <button type="submit" disabled={isSubmitting} className="bg-white text-green-700 px-10 py-3 rounded-full font-bold cursor-pointer">
                {isSubmitting ? 'Saving...' : 'Submit'}
              </button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

// Render the application
ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
